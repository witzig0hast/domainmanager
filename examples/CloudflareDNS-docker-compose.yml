# Beispiel: dein bestehendes CloudflareDNS/docker-compose.yml nach der Umstellung.
# Neu ist nur der env_file-Eintrag – die Domain-Liste steht jetzt in managed/ddns.env
# und wird vom DomainManager gepflegt. DOMAINS/IP4_DOMAINS/IP6_DOMAINS hier entfernen!
services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    network_mode: host
    restart: always
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    env_file:
      - ./managed/ddns.env
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - PROXIED=true
